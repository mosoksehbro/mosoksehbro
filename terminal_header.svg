<svg xmlns="http://www.w3.org/2000/svg" width="700" height="210" viewBox="0 0 700 210" fill="none">
  <defs>
    <linearGradient id="linux-term-grad" x1="0" y1="0" x2="700" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#11121d" />
      <stop offset="100%" stop-color="#161724" />
    </linearGradient>
  </defs>

  <!-- Linux Terminal Frame -->
  <rect x="0.5" y="0.5" width="699" height="209" rx="5" fill="url(#linux-term-grad)" stroke="#24283b" stroke-width="1" />

  <!-- Linux Flat Window Header -->
  <rect x="0.5" y="0.5" width="699" height="32" rx="5" fill="#0d0e17" />
  <rect x="0.5" y="20" width="699" height="12" fill="#0d0e17" />
  <line x1="0.5" y1="32.5" x2="699.5" y2="32.5" stroke="#24283b" />

  <!-- Linux Terminal Tab / Distro Badge -->
  <g transform="translate(14, 8)">
    <rect width="180" height="17" rx="3" fill="#1a1b27" stroke="#24283b" stroke-width="0.8" />
    <text x="10" y="12.5" fill="#7aa2f7" font-family="'Fira Code', monospace" font-size="10.5px" font-weight="600">🐧 gosade@workstation:~</text>
  </g>

  <!-- Window controls: Linux Flat style (Min, Max, Close) -->
  <g transform="translate(635, 10)" stroke="#565f89" stroke-width="1.2">
    <!-- Minimize -->
    <line x1="0" y1="6" x2="10" y2="6" />
    <!-- Maximize -->
    <rect x="18" y="1" width="10" height="10" rx="1" fill="none" />
    <!-- Close -->
    <line x1="36" y1="1" x2="46" y2="11" />
    <line x1="46" y1="1" x2="36" y2="11" />
  </g>

  <!-- Terminal Content -->
  <g transform="translate(24, 58)" font-family="'Fira Code', monospace, -apple-system" font-size="12.5px">
    <!-- Prompt 1 -->
    <text x="0" y="0" fill="#9ece6a" font-weight="700">gosade@workstation</text>
    <text x="145" y="0" fill="#565f89">:</text>
    <text x="155" y="0" fill="#7aa2f7" font-weight="600">~</text>
    <text x="170" y="0" fill="#c0caf5">$ whoami &amp;&amp; uname -srm</text>

    <!-- Output 1 -->
    <text x="16" y="22" fill="#7dcfff" font-weight="600">Martin (Deeminor)</text>
    <text x="165" y="22" fill="#565f89">—</text>
    <text x="180" y="22" fill="#c0caf5">Linux 6.6 x86_64 [WSL2 / Ubuntu LTS]</text>

    <!-- Prompt 2 -->
    <text x="0" y="52" fill="#9ece6a" font-weight="700">gosade@workstation</text>
    <text x="145" y="52" fill="#565f89">:</text>
    <text x="155" y="52" fill="#7aa2f7" font-weight="600">~</text>
    <text x="170" y="52" fill="#c0caf5">$ cat /etc/mandate</text>

    <!-- Output 2 -->
    <text x="16" y="74" fill="#bb9af7">"Building resilient backends, clean architectures &amp; scalable pipelines."</text>

    <!-- Tmux Statusbar at bottom -->
    <g transform="translate(-10, 114)">
      <rect x="0" y="0" width="672" height="24" rx="3" fill="#0d0e17" stroke="#1f2335" stroke-width="0.8" />
      
      <!-- Session Name -->
      <rect x="0" y="0" width="80" height="24" rx="3" fill="#7aa2f7" />
      <text x="40" y="16" text-anchor="middle" fill="#0d0e17" font-weight="700" font-size="11px">[tmux: dev]</text>

      <!-- Active Window -->
      <text x="95" y="16" fill="#7dcfff" font-size="11px" font-weight="600">0:zsh*</text>
      <text x="145" y="16" fill="#565f89" font-size="11px">1:nvim</text>
      <text x="195" y="16" fill="#565f89" font-size="11px">2:docker</text>

      <!-- Host & Status on Right -->
      <text x="660" y="16" text-anchor="end" fill="#565f89" font-size="10.5px">gosade.my.id | GMT+7</text>
    </g>
  </g>
</svg>
