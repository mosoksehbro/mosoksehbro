<svg xmlns="http://www.w3.org/2000/svg" width="700" height="200" viewBox="0 0 700 200" fill="none">
  <rect x="1" y="1" rx="6" ry="6" width="698" height="198" fill="#1a1b27" stroke="#24283b" stroke-width="1" />
  
  <text x="32" y="42" fill="#70a5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20px" font-weight="700">mosoksehbro (Deeminor)</text>
  
  <g transform="translate(32, 70)">
    <!-- Contributions -->
    <g transform="translate(0, 0)">
      <circle cx="6" cy="6" r="5" fill="#bf91f3" />
      <text x="22" y="10" fill="#38bdae" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14px" font-weight="500">1,534 Contributions in last year</text>
    </g>

    <!-- Repos detail: Public, Private, Collaborator -->
    <g transform="translate(0, 30)">
      <circle cx="6" cy="6" r="5" fill="#bf91f3" />
      <text x="22" y="10" fill="#38bdae" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14px" font-weight="500">9 Public • 27 Private • 14 Collaborator Repos</text>
    </g>

    <!-- Joined age -->
    <g transform="translate(0, 60)">
      <circle cx="6" cy="6" r="5" fill="#bf91f3" />
      <text x="22" y="10" fill="#38bdae" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14px" font-weight="500">Joined GitHub 5 years ago</text>
    </g>

    <!-- Location -->
    <g transform="translate(0, 90)">
      <circle cx="6" cy="6" r="5" fill="#bf91f3" />
      <text x="22" y="10" fill="#38bdae" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14px" font-weight="500">Indonesia</text>
    </g>
  </g>
  
  <!-- Right badge: Ecosystem Breakdown -->
  <g transform="translate(420, 35)">
    <rect width="245" height="135" rx="6" fill="#13141f" stroke="#24283b" stroke-width="1" />
    <text x="20" y="30" fill="#70a5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13px" font-weight="700">REPOSITORY ACCESS MATRIX</text>
    
    <text x="20" y="60" fill="#c0caf5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13px">Public Repositories</text>
    <text x="210" y="60" text-anchor="end" fill="#38bdae" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13px" font-weight="700">9</text>

    <text x="20" y="85" fill="#c0caf5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13px">Private Repositories</text>
    <text x="210" y="85" text-anchor="end" fill="#38bdae" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13px" font-weight="700">27</text>

    <text x="20" y="110" fill="#c0caf5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13px">Collaborator / Orgs</text>
    <text x="210" y="110" text-anchor="end" fill="#38bdae" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13px" font-weight="700">14</text>
  </g>
</svg>